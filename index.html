<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职复习进度清单 · prepare-for-job</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#24292f;--mut:#6a737d;--acc:#0969da;--ok:#1a7f37;--warn:#9a6700;--line:#e1e4e8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 80px}
header{margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.toolbar input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.total{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.total .nums{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut)}
.total b{color:var(--ink)}
.bar{height:10px;background:#eef0f2;border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2da44e,#1a7f37);border-radius:6px;transition:width .3s}
.cat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.cat>h2{font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:center}
.cat .pct{font-size:13px;color:var(--mut)}
.subh{margin:14px 0 6px;font-size:13.5px;color:var(--acc);font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.item:hover{background:#f6f8fa}
.item .st{flex:none;width:86px;border:none;border-radius:20px;padding:3px 0;font-size:12.5px;cursor:pointer;text-align:center}
.s0{background:#eef0f2;color:#6a737d}
.s1{background:#fff3cd;color:var(--warn)}
.s2{background:#d9f0e1;color:var(--ok)}
.item a{color:var(--ink);text-decoration:none;flex:1}
.item a:hover{color:var(--acc)}
.item .d{font-size:12px;color:var(--mut);flex:none}
.hidden{display:none}
.foot{color:var(--mut);font-size:12.5px;margin-top:24px}
.foot code{background:#eff1f3;border-radius:4px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>求职复习进度清单</h1>
<div class="sub">每个知识点页三态记录（未学 / 学习中 / 已完成）+ 最近学习日期；进度自动保存在本浏览器，建议定期导出 JSON 备份。</div>
</header>
<div class="toolbar">
<input type="search" id="q" placeholder="搜索标题或分类，如 Java、TCP、注意力…">
<button class="btn" id="exportBtn">导出进度 JSON</button>
<button class="btn" id="importBtn">导入进度 JSON</button>
<input type="file" id="importFile" accept=".json" hidden>
</div>
<div class="total" id="total"></div>
<div id="list"></div>
<div id="noResult" class="hidden" style="padding:30px 0;text-align:center;color:var(--mut)">没有匹配的条目——标题和分类路径都会参与匹配，换个关键词试试。</div>
<div class="foot">
双击本页即用；知识点页放回对应子文件夹后运行 <code>python tools/build_checklist.py</code> 即重新生成清单。
进度以浏览器 localStorage（键 <code>pfj-progress-v1</code>）为准，换浏览器/清缓存前先导出。
</div>
</div>
<script src="checklist.js"></script>
<script>
(function(){
  var KEY='pfj-progress-v1';
  var state={};
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){state={};}
  function save(){localStorage.setItem(KEY,JSON.stringify(state));}
  var DATA=window.CHECKLIST||{categories:[]};
  var STATUS=['○ 未学','◐ 学习中','● 已完成'];

  function totalInfo(){
    var t=0,c=0,l=0;
    DATA.categories.forEach(function(cat){cat.subs.forEach(function(s){
      s.items.forEach(function(it){t++;
        var p=state[it.p];
        if(p&&p.s===2)c++;
        if(p&&p.s===1)l++;
      });
    });});
    return {t:t,c:c,l:l};
  }

  function render(){
    var info=totalInfo();
    var pct=info.t?Math.round(info.c/info.t*100):0;
    document.getElementById('total').innerHTML=
      '<div class="nums"><span>总进度 <b>'+info.c+'</b> / '+info.t+' 已完成，学习中 <b>'+info.l+'</b></span><span>'+pct+'%</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>';
    var html='';
    DATA.categories.forEach(function(cat){
      var ct=0,cc=0;
      cat.subs.forEach(function(s){s.items.forEach(function(it){ct++;var p=state[it.p];if(p&&p.s===2)cc++;});});
      var cp=ct?Math.round(cc/ct*100):0;
      html+='<section class="cat" data-cat="'+cat.name+'"><h2>'+cat.name+
        '<span class="pct">'+cc+'/'+ct+' · '+cp+'%</span></h2>'+
        '<div class="bar" style="margin:8px 0 2px"><i style="width:'+cp+'%"></i></div>';
      cat.subs.forEach(function(s){
        html+='<div class="subh">'+s.name+'</div>';
        s.items.forEach(function(it){
          var p=state[it.p]||{s:0,d:''};
          html+='<div class="item" data-t="'+it.t+'" data-p="'+it.p+'">'+
            '<button class="st s'+p.s+'" data-p="'+it.p+'" data-s="'+p.s+'">'+STATUS[p.s]+'</button>'+
            '<a href="'+it.p+'" target="_blank">'+it.t+'</a>'+
            '<span class="d">'+(p.d?p.d:'')+'</span></div>';
        });
      });
      html+='</section>';
    });
    document.getElementById('list').innerHTML=html;
    applyFilter();
  }

  document.getElementById('list').addEventListener('click',function(ev){
    var btn=ev.target.closest('.st');
    if(!btn)return;
    var p=btn.dataset.p, cur=+btn.dataset.s, next=(cur+1)%3;
    state[p]={s:next,d:next===0?'':new Date().toISOString().slice(0,10)};
    save();render();
  });

  function applyFilter(){
    var q=document.getElementById('q').value.trim().toLowerCase();
    var shown=0;
    document.querySelectorAll('.item').forEach(function(el){
      var hay=(el.dataset.t+' '+(el.dataset.p||'')).toLowerCase();
      var hit=!q||hay.indexOf(q)>=0;
      el.classList.toggle('hidden',!hit);
      if(hit)shown++;
    });
    document.querySelectorAll('.subh').forEach(function(sh){
      var any=false, el=sh.nextElementSibling;
      while(el&&!el.classList.contains('subh')){
        if(el.classList.contains('item')&&!el.classList.contains('hidden')){any=true;break;}
        el=el.nextElementSibling;
      }
      sh.classList.toggle('hidden', q && !any);
    });
    document.querySelectorAll('.cat').forEach(function(cat){
      var anyVisible=cat.querySelectorAll('.item:not(.hidden)').length>0;
      cat.classList.toggle('hidden', q && !anyVisible);
    });
    var nr=document.getElementById('noResult');
    if(nr)nr.classList.toggle('hidden', !q || shown>0);
  }
  document.getElementById('q').addEventListener('input',applyFilter);

  document.getElementById('exportBtn').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify({app:'prepare-for-job',version:1,exportedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='prepare-for-job-progress-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json';
    a.click();URL.revokeObjectURL(a.href);
  });

  document.getElementById('importBtn').addEventListener('click',function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change',function(ev){
    var f=ev.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){try{
      var data=JSON.parse(r.result);
      if(!data.progress)throw 0;
      state=data.progress;save();render();alert('导入成功');
    }catch(e){alert('文件格式不对，请选择本页导出的 JSON');}};
    r.readAsText(f);ev.target.value='';
  });

  render();
})();
</script>
</body>
</html>
